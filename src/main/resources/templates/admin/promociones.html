<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Promociones')}"></head>
<body class="bg-background text-on-background font-body-md min-h-screen flex">

<aside th:replace="~{fragments/admin-layout :: sidebar('promociones')}"></aside>

<div class="flex-1 min-w-0">
    <header th:replace="~{fragments/admin-layout :: topbar('Promociones', 'promociones')}"></header>
    <nav th:replace="~{fragments/admin-layout :: mobile-nav('promociones')}"></nav>

    <main class="p-6 md:p-10 max-w-5xl mx-auto space-y-8">
        <div class="flex flex-wrap items-center justify-between gap-4">
            <h1 class="hidden lg:block font-headline-lg text-headline-lg text-on-surface">Promociones</h1>
            <button type="button" class="inline-flex items-center gap-2 bg-primary text-on-primary font-label-md text-label-md px-6 py-3 rounded-full hover:bg-hover-orange transition-colors duration-300" th:onclick="|showToast('Nueva promoción creada (modo demostración).')|">
                <span class="material-symbols-outlined text-[18px]">add</span> Nueva promoción
            </button>
        </div>

        <!-- Promociones activas -->
        <div>
            <h2 class="font-headline-sm text-headline-sm text-on-surface mb-4">Activas</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6" th:if="${promociones != null and !promociones.isEmpty()}">
                <div th:each="p : ${promociones}" class="bg-white rounded-xl border border-surface-variant overflow-hidden flex">
                    <img class="w-32 h-auto object-cover" th:src="${p.imagenUrl}" th:alt="${p.nombre}"/>
                    <div class="p-5 flex-grow space-y-2">
                        <h3 class="font-label-md text-label-md text-on-surface" th:text="${p.nombre}">Plato</h3>
                        <div class="flex items-center gap-2">
                            <span class="font-label-sm text-label-sm text-on-surface-variant line-through opacity-70" th:text="'S/ ' + ${#numbers.formatDecimal(p.precioAnterior, 1, 2)}">S/ 0.00</span>
                            <span class="font-label-md text-label-md text-primary font-bold" th:text="'S/ ' + ${#numbers.formatDecimal(p.precio, 1, 2)}">S/ 0.00</span>
                        </div>
                        <div class="flex gap-4 pt-2">
                            <button type="button" class="font-label-sm text-label-sm text-primary hover:text-hover-orange" th:onclick="|showToast('Edición de promoción (modo demostración).')|">Editar</button>
                            <button type="button" class="font-label-sm text-label-sm text-error hover:text-error/80" th:onclick="|showToast('Promoción finalizada (modo demostración).')|">Finalizar</button>
                        </div>
                    </div>
                </div>
            </div>
            <div th:if="${promociones == null or promociones.isEmpty()}" class="text-center py-12 bg-white rounded-xl border border-surface-variant">
                <p class="font-body-md text-body-md text-on-surface-variant">No hay promociones activas por el momento.</p>
            </div>
        </div>

        <!-- Crear nueva promoción rápida -->
        <div class="bg-white rounded-xl border border-surface-variant p-6 space-y-4">
            <h2 class="font-headline-sm text-headline-sm text-on-surface">Aplicar descuento a un producto</h2>
            <form th:action="@{/admin/promociones/aplicar}" method="post" class="grid grid-cols-1 sm:grid-cols-3 gap-4 items-end">
                <div class="sm:col-span-1">
                    <label class="font-label-md text-label-md text-on-surface block mb-2" for="producto">Producto</label>
                    <select id="producto" name="productoId" class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest outline-none font-body-md text-body-md">
                        <option th:each="p : ${productos}" th:value="${p.id}" th:text="${p.nombre}">Producto</option>
                    </select>
                </div>
                <div>
                    <label class="font-label-md text-label-md text-on-surface block mb-2" for="descuento">Descuento (%)</label>
                    <input id="descuento" name="descuento" type="number" min="1" max="90" class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest outline-none font-body-md text-body-md" placeholder="Ej. 15"/>
                </div>
                <div>
                    <label class="font-label-md text-label-md text-on-surface block mb-2" for="precioAnterior">Precio anterior (S/)</label>
                    <input id="precioAnterior" name="precioAnterior" type="number" step="0.10" min="0" class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest outline-none font-body-md text-body-md" placeholder="Ej. 40.00"/>
                </div>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="bg-primary text-on-primary font-label-md text-label-md py-3 rounded-full hover:bg-hover-orange transition-colors duration-300">
                    Aplicar promoción
                </button>
            </form>
        </div>
    </main>
</div>

</body>
</html>
