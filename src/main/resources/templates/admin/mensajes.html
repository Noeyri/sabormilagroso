<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Mensajes')}"></head>
<body class="bg-background text-on-background font-body-md min-h-screen flex">

<aside th:replace="~{fragments/admin-layout :: sidebar('mensajes')}"></aside>

<div class="flex-1 min-w-0">
    <header th:replace="~{fragments/admin-layout :: topbar('Mensajes', 'mensajes')}"></header>
    <nav th:replace="~{fragments/admin-layout :: mobile-nav('mensajes')}"></nav>

    <main class="p-6 md:p-10 max-w-4xl mx-auto space-y-6">
        <div class="flex items-center justify-between">
            <h1 class="hidden lg:block font-headline-lg text-headline-lg text-on-surface">Mensajes de contacto</h1>
            <span class="font-label-md text-label-md text-primary" th:text="${sinLeer} + ' sin leer'">0 sin leer</span>
        </div>

        <div th:if="${#lists.isEmpty(mensajes)}" class="bg-white rounded-xl border border-surface-variant p-10 text-center">
            <span class="material-symbols-outlined text-outline text-[40px]">mail</span>
            <p class="font-body-md text-body-md text-on-surface-variant mt-2">Aún no hay mensajes.</p>
        </div>

        <div th:each="m : ${mensajes}"
             class="bg-white rounded-xl border p-6 space-y-3"
             th:classappend="${!m.leido} ? 'border-primary' : 'border-surface-variant'">
            <div class="flex flex-wrap items-start justify-between gap-2">
                <div class="min-w-0">
                    <p class="font-label-md text-label-md text-on-surface" th:text="${m.nombre}">Nombre</p>
                    <p class="font-label-sm text-label-sm text-on-surface-variant">
                        <a th:href="'mailto:' + ${m.email}" class="text-primary hover:text-hover-orange" th:text="${m.email}">correo</a>
                        <span th:if="${m.telefono != null}" th:text="' · ' + ${m.telefono}"></span>
                    </p>
                </div>
                <div class="text-right">
                    <span th:if="${!m.leido}" class="font-label-sm text-label-sm px-3 py-1 rounded-full bg-primary-fixed text-on-primary-fixed">Nuevo</span>
                    <p class="font-label-sm text-label-sm text-on-surface-variant mt-1" th:text="${m.fechaFormateada}">Fecha</p>
                </div>
            </div>

            <p class="font-body-md text-body-md text-on-surface whitespace-pre-line" th:text="${m.mensaje}">Mensaje</p>

            <div class="flex items-center gap-4 pt-2 border-t border-surface-variant">
                <form th:action="@{/admin/mensajes/{id}/leido(id=${m.id})}" method="post" class="inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="font-label-md text-label-md text-primary hover:text-hover-orange"
                            th:text="${m.leido} ? 'Marcar como no leído' : 'Marcar como leído'">Marcar</button>
                </form>
                <form th:action="@{/admin/mensajes/{id}/eliminar(id=${m.id})}" method="post" class="inline"
                      onsubmit="return confirm('¿Eliminar este mensaje?');">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="font-label-md text-label-md text-error hover:text-error/80">Eliminar</button>
                </form>
            </div>
        </div>
    </main>
</div>

</body>
</html>
