<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${producto.nombre})}"></head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">

<header th:replace="~{fragments/header :: header('menu')}"></header>

<main class="flex-grow page-content pb-24">

    <!-- Migas de pan -->
    <section class="px-margin-mobile md:px-margin-desktop max-w-container-max mx-auto pt-6 pb-2">
        <nav class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-2">
            <a th:href="@{/}" class="hover:text-primary">Inicio</a> <span>/</span>
            <a th:href="@{/menu}" class="hover:text-primary">Menú</a> <span>/</span>
            <span class="text-on-surface" th:text="${producto.nombre}">Producto</span>
        </nav>
    </section>

    <section class="px-margin-mobile md:px-margin-desktop max-w-container-max mx-auto py-8">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
            <!-- Imagen -->
            <div class="relative h-80 md:h-[480px] rounded-2xl overflow-hidden shadow-sm">
                <img class="w-full h-full object-cover" th:src="${producto.imagenUrl}" th:alt="${producto.nombre}"/>
                <div class="absolute top-4 right-4 z-10">
                    <th:block th:replace="~{fragments/favorito :: corazon(${producto.id})}"></th:block>
                </div>
                <div th:if="${producto.recomendado}" class="absolute top-4 left-4 bg-tertiary-container text-on-tertiary-container px-3 py-1 rounded-full font-label-sm text-label-sm">Recomendado</div>
            </div>

            <!-- Info -->
            <div class="flex flex-col">
                <span class="font-label-md text-label-md text-primary mb-2" th:text="${producto.categoria}">Categoría</span>
                <h1 class="font-headline-xl text-headline-xl text-on-surface mb-4" th:text="${producto.nombre}">Nombre del producto</h1>

                <div class="flex items-center gap-4 mb-6">
                    <div class="flex items-center gap-1 text-tertiary">
                        <span class="material-symbols-outlined text-[20px]">star</span>
                        <span class="font-label-md text-label-md text-on-surface" th:text="${producto.calificacion}">4.8</span>
                    </div>
                    <div class="flex items-center gap-1 text-on-surface-variant">
                        <span class="material-symbols-outlined text-[20px]">schedule</span>
                        <span class="font-label-md text-label-md" th:text="${producto.tiempoPreparacionMin} + ' min'">20 min</span>
                    </div>
                </div>

                <p class="font-body-lg text-body-lg text-on-surface-variant mb-8" th:text="${producto.descripcionLarga}">
                    Descripción larga del producto.
                </p>

                <div th:if="${producto.stock != null and producto.stock <= 0}" class="mb-6">
                    <span class="bg-surface-variant text-on-surface-variant px-4 py-2 rounded-full font-label-md text-label-md">Agotado</span>
                </div>
                <div th:if="${param.sinStock}" class="mb-6 bg-red-50 border border-red-200 text-red-700 font-body-md text-body-md px-4 py-3 rounded-lg">
                    No hay suficiente stock disponible.
                </div>
                
                <div class="flex items-end gap-4 mb-8">
                    <span th:if="${producto.enPromocion}" class="font-body-lg text-body-lg text-on-surface-variant line-through opacity-70" th:text="'S/ ' + ${#numbers.formatDecimal(producto.precioAnterior, 1, 2)}">S/ 0.00</span>
                    <span class="font-headline-lg text-headline-lg text-primary font-bold" th:text="'S/ ' + ${#numbers.formatDecimal(producto.precio, 1, 2)}">S/ 0.00</span>
                </div>

                <!-- Formulario de agregar al carrito -->
                <form th:action="@{/carrito/agregar}" method="post" class="flex flex-col md:flex-row md:items-center gap-4">
                    <input type="hidden" name="id" th:value="${producto.id}"/>
                    <div class="flex items-center border border-outline-variant rounded-full">
                        <button type="button" class="w-11 h-11 flex items-center justify-center text-on-surface-variant hover:text-primary" onclick="document.getElementById('qty').stepDown()">
                            <span class="material-symbols-outlined">remove</span>
                        </button>
                        <input id="qty" name="cantidad" type="number" value="1" min="1" class="w-12 text-center font-label-md text-label-md bg-transparent outline-none"/>
                        <button type="button" class="w-11 h-11 flex items-center justify-center text-on-surface-variant hover:text-primary" onclick="document.getElementById('qty').stepUp()">
                            <span class="material-symbols-outlined">add</span>
                        </button>
                    </div>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="w-full md:w-auto bg-primary text-on-primary font-label-md text-label-md px-10 py-4 rounded-full shadow-sm hover:bg-hover-orange hover:-translate-y-1 hover:shadow-md transition-all duration-300 flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined">add_shopping_cart</span> Agregar al pedido
                    </button>
                </form>
            </div>
        </div>
    </section>

    <!-- Relacionados -->
    <section class="px-margin-mobile md:px-margin-desktop max-w-container-max mx-auto py-12" th:if="${relacionados != null and !relacionados.isEmpty()}">
        <h2 class="font-headline-md text-headline-md text-on-surface mb-8">También te puede interesar</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <a th:each="r : ${relacionados}" th:href="@{/producto/{id}(id=${r.id})}" class="bg-white rounded-xl shadow-sm overflow-hidden hover:-translate-y-2 hover:shadow-md transition-all duration-300 border border-surface-variant block">
                <div class="h-48 w-full overflow-hidden">
                    <img class="w-full h-full object-cover" th:src="${r.imagenUrl}" th:alt="${r.nombre}"/>
                </div>
                <div class="p-5 space-y-2">
                    <h3 class="font-headline-sm text-headline-sm text-on-surface" th:text="${r.nombre}">Plato</h3>
                    <span class="font-label-md text-label-md text-primary" th:text="'S/ ' + ${#numbers.formatDecimal(r.precio, 1, 2)}">S/ 0.00</span>
                </div>
            </a>
        </div>
    </section>

</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
