<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Nueva contraseña')}"></head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">

<header th:replace="~{fragments/header :: header('login')}"></header>

<main class="flex-grow page-content pb-24 flex items-center justify-center px-margin-mobile">
    <div class="w-full max-w-md bg-white p-8 md:p-10 rounded-2xl shadow-sm border border-surface-variant">

        <!-- Enlace inválido o vencido -->
        <div th:if="${tokenInvalido}" class="text-center space-y-4">
            <span class="material-symbols-outlined text-error text-[40px]">link_off</span>
            <h1 class="font-headline-lg text-headline-lg text-primary">Enlace no válido</h1>
            <p class="font-body-md text-body-md text-on-surface-variant">
                El enlace de recuperación venció o ya fue utilizado. Solicita uno nuevo.
            </p>
            <a th:href="@{/recuperar-password}" class="inline-block bg-primary text-on-primary font-label-md text-label-md px-8 py-3 rounded-full hover:bg-hover-orange transition-colors duration-300">
                Solicitar nuevo enlace
            </a>
        </div>

        <!-- Formulario de nueva contraseña -->
        <div th:unless="${tokenInvalido}">
            <div class="text-center mb-8">
                <span class="material-symbols-outlined text-primary text-[40px] mb-2">lock_reset</span>
                <h1 class="font-headline-lg text-headline-lg text-primary mb-2">Nueva contraseña</h1>
                <p class="font-body-md text-body-md text-on-surface-variant">Elige una contraseña de al menos 6 caracteres.</p>
            </div>

            <form th:action="@{/restablecer-password}" method="post" class="space-y-6">
                <div th:if="${error}" class="bg-red-50 border border-red-200 text-red-700 font-body-md text-body-md px-4 py-3 rounded-lg" th:text="${error}">Error</div>
                <input type="hidden" name="token" th:value="${token}"/>
                <div>
                    <label class="font-label-md text-label-md text-on-surface block mb-2" for="password">Nueva contraseña</label>
                    <input id="password" name="password" type="password" required="required" minlength="6" class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary outline-none font-body-md text-body-md" placeholder="••••••••"/>
                </div>
                <div>
                    <label class="font-label-md text-label-md text-on-surface block mb-2" for="confirmar">Confirmar contraseña</label>
                    <input id="confirmar" name="confirmar" type="password" required="required" minlength="6" class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary outline-none font-body-md text-body-md" placeholder="••••••••"/>
                </div>

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-full hover:bg-hover-orange transition-colors duration-300">
                    Guardar contraseña
                </button>
            </form>
        </div>

    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
