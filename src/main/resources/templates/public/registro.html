<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Crear cuenta')}"></head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">

<header th:replace="~{fragments/header :: header('registro')}"></header>

<main class="flex-grow page-content pb-24 flex items-center justify-center px-margin-mobile">
    <div class="w-full max-w-md bg-white p-8 md:p-10 rounded-2xl shadow-sm border border-surface-variant">
        <div class="text-center mb-8">
            <h1 class="font-headline-lg text-headline-lg text-primary mb-2">Crea tu cuenta</h1>
            <p class="font-body-md text-body-md text-on-surface-variant">Regístrate para hacer pedidos y guardar tus favoritos.</p>
        </div>

        <form data-mock-submit="Registro simulado (aún sin backend)." class="space-y-5">
            <div>
                <label class="font-label-md text-label-md text-on-surface block mb-2" for="nombre">Nombre completo</label>
                <input id="nombre" name="nombre" type="text" required="required" class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary outline-none font-body-md text-body-md" placeholder="Tu nombre"/>
            </div>
            <div>
                <label class="font-label-md text-label-md text-on-surface block mb-2" for="email">Correo electrónico</label>
                <input id="email" name="email" type="email" required="required" class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary outline-none font-body-md text-body-md" placeholder="tucorreo@ejemplo.com"/>
            </div>
            <div>
                <label class="font-label-md text-label-md text-on-surface block mb-2" for="telefono">Teléfono</label>
                <input id="telefono" name="telefono" type="tel" class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary outline-none font-body-md text-body-md" placeholder="+51 999 999 999"/>
            </div>
            <div>
                <label class="font-label-md text-label-md text-on-surface block mb-2" for="password">Contraseña</label>
                <input id="password" name="password" type="password" required="required" class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary outline-none font-body-md text-body-md" placeholder="••••••••"/>
            </div>
            <div>
                <label class="font-label-md text-label-md text-on-surface block mb-2" for="password2">Confirmar contraseña</label>
                <input id="password2" name="password2" type="password" required="required" class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary outline-none font-body-md text-body-md" placeholder="••••••••"/>
            </div>

            <label class="flex items-start gap-2 font-body-md text-body-md text-on-surface-variant">
                <input type="checkbox" required="required" class="mt-1 rounded border-outline-variant text-primary focus:ring-primary"/>
                Acepto los términos y condiciones y la política de privacidad.
            </label>

            <button type="submit" class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-full hover:bg-hover-orange transition-colors duration-300">
                Crear cuenta
            </button>
        </form>

        <p class="text-center font-body-md text-body-md text-on-surface-variant mt-8">
            ¿Ya tienes una cuenta?
            <a th:href="@{/login}" class="text-primary font-label-md text-label-md hover:text-hover-orange transition-colors">Inicia sesión</a>
        </p>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
