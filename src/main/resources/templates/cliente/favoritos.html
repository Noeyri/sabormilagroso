<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Favoritos')}"></head>
<body class="bg-background text-on-background font-body-md min-h-screen flex">

<aside th:replace="~{fragments/cliente-layout :: sidebar('favoritos')}"></aside>

<div class="flex-1 min-w-0">
    <header th:replace="~{fragments/cliente-layout :: topbar('Favoritos', 'favoritos')}"></header>
    <nav th:replace="~{fragments/cliente-layout :: mobile-nav('favoritos')}"></nav>

    <main class="p-6 md:p-10 max-w-5xl mx-auto space-y-8">
        <h1 class="hidden lg:block font-headline-lg text-headline-lg text-on-surface">Mis favoritos</h1>

        <div th:if="${favoritos != null and !favoritos.isEmpty()}" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div th:each="p : ${favoritos}" class="bg-white rounded-xl overflow-hidden border border-surface-variant hover:shadow-md hover:-translate-y-1 transition-all duration-300 group">
                <div class="h-44 relative overflow-hidden">
                    <img class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" th:src="${p.imagenUrl}" th:alt="${p.nombre}"/>
                    <form th:action="@{/cliente/favoritos/{id}/toggle(id=${p.id})}" method="post" class="absolute top-3 right-3">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" aria-label="Quitar de favoritos" class="w-9 h-9 rounded-full bg-white/90 text-error flex items-center justify-center shadow-sm hover:bg-white transition-colors">
                            <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">favorite</span>
                        </button>
                    </form>
                </div>
                <div class="p-5 space-y-3">
                    <h3 class="font-headline-sm text-headline-sm text-on-surface" th:text="${p.nombre}">Plato</h3>
                    <div class="flex items-center justify-between">
                        <span class="font-label-md text-label-md text-primary font-bold" th:text="'S/ ' + ${#numbers.formatDecimal(p.precio, 1, 2)}">S/ 0.00</span>
                        <a th:href="@{/producto/{id}(id=${p.id})}" class="font-label-md text-label-md text-on-surface-variant hover:text-primary">Ver</a>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${favoritos == null or favoritos.isEmpty()}" class="text-center py-16 bg-white rounded-xl border border-surface-variant">
            <span class="material-symbols-outlined text-[48px] text-outline mb-2">favorite</span>
            <p class="font-body-lg text-body-lg text-on-surface-variant">Aún no tienes platos favoritos.</p>
            <a th:href="@{/menu}" class="inline-block mt-4 bg-primary text-on-primary font-label-md text-label-md px-6 py-3 rounded-full hover:bg-hover-orange transition-colors">Explorar menú</a>
        </div>
    </main>
</div>

</body>
</html>
