spring.application.name=sabormilagroso

# Puerto del servidor
server.port=8081

# Conexion a PostgreSQL - reemplaza con tus datos reales
spring.datasource.url=jdbc:postgresql://localhost:5432/sabormilagroso
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true

# URL pública (se usa para armar el enlace de recuperación)
app.base-url=http://localhost:8081
app.mail.from=no-reply@sabormilagroso.pe

# SMTP (opcional). Si NO configuras spring.mail.host, el enlace de
# recuperación se imprime en la consola en vez de enviarse por correo.
